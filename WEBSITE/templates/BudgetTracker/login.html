{% extends 'BudgetTracker/base.html' %}
{% load static %}

{% block content %}

<style>
    .login-container {
        width: 80%;
        max-width: 400px;
        margin: 50px auto;
        padding: 30px;
        background-color: white;
        border: 1px solid #ddd6fe;
        border-radius: 10px;
    }

    .login-container h1 {
        color: #6b21a8;
        font-size: 30px;
        margin-bottom: 25px;
        text-align: center;
    }

    .login-container form p {
        margin-bottom: 18px;
        color: #444;
    }

    .login-container label {
        display: block;
        margin-bottom: 7px;
        font-size: 14px;
        color: #6b21a8;
    }

    .login-container input[type="text"],
    .login-container input[type="password"] {
        width: 100%;
        padding: 11px;
        border: 1px solid #d8b4fe;
        border-radius: 5px;
        box-sizing: border-box;
        font-size: 14px;
    }

    .login-container input:focus {
        outline: none;
        border-color: #9333ea;
    }

    .login-button {
        width: 100%;
        padding: 12px;
        background-color: #7e22ce;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .login-button:hover {
        background-color: #6b21a8;
    }

    .login-container .errorlist {
        color: #dc2626;
        font-size: 13px;
        margin-bottom: 10px;
    }

    @media (max-width: 500px) {
        .login-container {
            width: auto;
            margin: 30px 15px;
            padding: 20px;
        }
    }
</style>

<div class="login-container">

    <h1>Log In</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" class="login-button">
            Log In
        </button>
    </form>

</div>

{% endblock %}
