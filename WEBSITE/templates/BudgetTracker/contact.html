{% extends 'BudgetTracker/base.html' %}
{% load static %}

{% block content %}

<style>
    .contact-container {
        width: 80%;
        max-width: 600px;
        margin: 40px auto;
        padding: 30px;
        background-color: white;
        border: 1px solid #d8b4fe;
        border-radius: 10px;
    }

    .contact-container h1 {
        color: #6b21a8;
        font-size: 28px;
        margin-bottom: 10px;
    }

    .contact-container p {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        color: #6b21a8;
        font-size: 15px;
        margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d8b4fe;
        border-radius: 5px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #9333ea;
    }

    .send-button {
        width: 100%;
        padding: 12px;
        background-color: #7e22ce;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }

    .send-button:hover {
        background-color: #6b21a8;
    }

    .contact-footer {
        text-align: center;
        color: #777;
        font-size: 13px;
        margin-top: 20px;
    }

    @media (max-width: 600px) {
        .contact-container {
            width: auto;
            margin: 25px 15px;
            padding: 20px;
        }
    }
</style>

<div class="contact-container">

    <h1>Contact Us</h1>

    <p>
        Have questions or suggestions? You can send us a message
        using the form below. We would be happy to hear from you.
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email address" required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"
                      placeholder="Write your message here"
                      required></textarea>
        </div>

        <button type="submit" class="send-button">
            Send Message
        </button>
    </form>

    <div class="contact-footer">
        BudgetTracker - We value your feedback.
    </div>

</div>

{% endblock %}
